[workspace]
resolver = "2"
members = [
    "crates/floravox-ssml",
    "crates/floravox-g2p",
    "crates/floravox-core",
    "crates/floravox-cli",
    "crates/floravox-capi",
]

[workspace.package]
readme = "README.md"
version = "0.5.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/AACTools/floravox"
keywords = ["tts", "ssml", "speech", "accessibility", "phonemizer"]
categories = ["accessibility", "text-processing", "multimedia::audio"]

[workspace.dependencies]
floravox-ssml = { path = "crates/floravox-ssml", version = "0.5.1" }
floravox-g2p = { path = "crates/floravox-g2p", version = "0.5.1" }
floravox-core = { path = "crates/floravox-core", version = "0.5.1" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
fst = "0.4"
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
