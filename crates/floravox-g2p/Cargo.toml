[package]
name = "floravox-g2p"
description = "Hybrid grapheme-to-phoneme: memory-mapped FST lexicons with pluggable OOV fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
default = ["misaki"]
onnx = ["dep:ort"]
# misaki G2P (the phonemizer Kokoro was trained with). MIT, fully
# self-contained; the crate's espeak fallback is NOT enabled (GPL).
misaki = ["dep:misaki-rs"]

[dependencies]
fst.workspace = true
memmap2 = "0.9"
ort = { workspace = true, optional = true }
misaki-rs = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
