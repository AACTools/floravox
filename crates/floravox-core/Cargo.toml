[package]
name = "floravox-core"
description = "ONNX synthesis orchestration: duration folding, sample-accurate event timeline, streaming API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
default = ["onnx", "misaki", "uroman"]
# ONNX inference via the `ort` crate. Disable for a frontend-only build
# (timeline math, SSML, estimation fallback) with zero native deps.
onnx = ["dep:ort", "dep:ndarray"]
# Document-level misaki G2P pre-pass (the phonemizer Kokoro was trained
# with). MIT and fully self-contained; adds ~9 MB of embedded dictionary.
misaki = ["floravox-g2p/misaki"]
# uroman romanization in CharFrontend (any script -> Latin); vendored
# tables add ~1 MB.
uroman = ["floravox-g2p/uroman"]

[dependencies]
floravox-ssml = { workspace = true }
floravox-g2p = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ort = { workspace = true, optional = true }
ndarray = { version = "0.16", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
